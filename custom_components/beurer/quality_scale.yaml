# Quality scale declaration for the Beurer TL 100 integration.
#
# Every rule is listed either as `done` or as `exempt` with a reason, so the
# file doubles as an honest roadmap. See
# https://developers.home-assistant.io/docs/core/integration-quality-scale/
# for the meaning of each rule.

rules:
  # ---- Bronze ----
  action-setup:
    status: exempt
    comment: The integration does not register any custom actions.
  appropriate-polling:
    status: exempt
    comment: |
      State is pushed over GATT notifications, and every command is followed by a
      debounced status query rather than a polling loop. The light entity keeps a
      single 60 s status poll as a resync path for notifications missed while the
      BLE link was down; the timer entities disable polling because they only
      mirror notification data.
  brands:
    status: done
    comment: Icons and logos ship in custom_components/beurer/brand.
  common-modules:
    status: done
    comment: Device communication lives in beurer.py, constants in const.py.
  config-flow:
    status: done
  config-flow-test-coverage:
    status: done
    comment: tests/test_config_flow.py covers discovery, manual and reconfigure.
  dependency-transparency:
    status: done
  docs-actions:
    status: exempt
    comment: No custom actions.
  docs-conditions:
    status: exempt
    comment: No custom conditions.
  docs-high-level-description:
    status: done
  docs-installation-instructions:
    status: done
  docs-removal-instructions:
    status: done
  docs-triggers:
    status: exempt
    comment: No custom triggers.
  entity-event-setup:
    status: done
    comment: Notification callbacks are registered in async_setup_entry and removed on unload.
  entity-unique-id:
    status: done
    comment: Every entity derives its unique ID from the formatted MAC address.
  has-entity-name:
    status: done
  runtime-data:
    status: done
    comment: The client is stored on entry.runtime_data via BeurerConfigEntry.
  test-before-configure:
    status: done
    comment: The setup flow toggles the lamp and asks whether it blinked.
  test-before-setup:
    status: done
    comment: async_setup_entry raises ConfigEntryNotReady when the lamp is out of range.
  unique-config-entry:
    status: done
    comment: The formatted MAC address is the config entry unique ID.

  # ---- Silver ----
  action-exceptions:
    status: exempt
    comment: No custom actions.
  config-entry-unloading:
    status: done
  docs-configuration-parameters:
    status: exempt
    comment: The integration has no options; everything is discovered or edited via reconfigure.
  docs-installation-parameters:
    status: done
    comment: README documents the MAC address and name parameters.
  entity-unavailable:
    status: done
    comment: Entities delegate to BeurerInstance.available, which follows the live connection.
  integration-owner:
    status: done
    comment: |
      manifest.json lists @tyz as the code owner, which matches the repository
      stated in documentation and issue_tracker.
  log-when-unavailable:
    status: done
    comment: |
      The first failed reconnection is logged at INFO with a note that retrying
      continues, further attempts stay at DEBUG, and a successful reconnect
      logs one INFO line.
  parallel-updates:
    status: exempt
    comment: |
      Every logical command is serialised by a single command lock inside
      BeurerInstance, because a command such as enabling the timer is two frames
      with a pause in between and must not interleave with another entity's
      frames. Status queries take the same lock, so the number cannot be left for
      Home Assistant to manage.
  reauthentication-flow:
    status: exempt
    comment: |
      BLE offers no credentials to reauthenticate. A lamp that is unreachable at
      its stored address is retried indefinitely and shown as unavailable; a
      lamp that moved to a different address needs the entry to be deleted and
      re-added, because entity unique IDs are derived from the address.
  test-coverage:
    status: done

  # ---- Gold ----
  devices:
    status: done
  diagnostics:
    status: done
  discovery:
    status: done
    comment: async_step_bluetooth reacts to the lamp's BLE advertisements.
  discovery-update-info:
    status: exempt
    comment: The MAC address is the only identifying information and never changes.
  docs-data-update:
    status: done
  docs-examples:
    status: done
  docs-known-limitations:
    status: done
  docs-supported-devices:
    status: done
  docs-supported-functions:
    status: done
  docs-troubleshooting:
    status: done
  docs-use-cases:
    status: done
  dynamic-devices:
    status: exempt
    comment: One config entry corresponds to exactly one lamp.
  entity-category:
    status: done
  entity-device-class:
    status: done
  entity-disabled-by-default:
    status: exempt
    comment: |
      Every entity the integration creates is a primary control the user set
      the integration up for. Disabling them by default would only add a step.
  entity-translations:
    status: done
  exception-translations:
    status: done
  icon-translations:
    status: done
  reconfiguration-flow:
    status: done
  repair-issues:
    status: exempt
    comment: |
      An unreachable lamp is a normal, temporary condition, handled by retrying
      and reporting the entities unavailable. A repair issue would surface on
      every relocation or proxy reboot. A permanent address change is fixed
      through the reconfigure flow instead.
  stale-devices:
    status: exempt
    comment: The integration only ever registers the single device of its config entry.

  # ---- Platinum ----
  async-dependency:
    status: done
    comment: Bleak is fully asynchronous.
  inject-websession:
    status: exempt
    comment: The integration does not talk to an HTTP API.
  strict-typing:
    status: done
    comment: |
      mypy.ini mirrors the settings Home Assistant core uses, including
      explicit-override and strict-equality. The integration also passes
      --strict --no-implicit-reexport, which is stricter than core requires.
