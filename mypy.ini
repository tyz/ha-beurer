# Mirrors the settings Home Assistant core uses for its own code, so this
# integration is held to the same standard as an upstream integration.
# Copied from the core repository's generated mypy config; the core-only
# mypy_path and plugins lines are left out because this repository has no
# stubs/ directory or mypy_plugins/ directory.
#
# The mypy-homeassistant.* sections of the core config are intentionally not
# copied: they configure how mypy checks Home Assistant's own sources, which
# are third-party code here.

[mypy]
python_version = 3.14
platform = linux
show_error_codes = true
follow_imports = normal
native_parser = true
num_workers = 2
local_partial_types = true
strict_equality = true
strict_bytes = true
no_implicit_optional = true
warn_incomplete_stub = true
warn_redundant_casts = true
warn_unused_ignores = true
enable_error_code = deprecated, explicit-override, ignore-without-code, redundant-self, truthy-iterable
disable_error_code = annotation-unchecked, import-not-found, import-untyped
extra_checks = false
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
warn_return_any = true
warn_unreachable = true
